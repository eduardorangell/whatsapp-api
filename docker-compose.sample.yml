services:
  wapi-bot:
    image: wpp-api:latest
    container_name: wpp-api
    volumes:
      - ~/Documents/Docker/wpp-deno/tokens:/app/tokens
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      - FOLDER_TOKEN_NAME=tokens
      - HEADLESS=true
      - USE_CHROME=true
      - CREATE_PATH_FILE_TOKEN=true
      - WAIT_FOR_LOGIN=true
      - AUTO_CLOSE=180000
      - WHATSAPP_VERSION=2.2413.51
