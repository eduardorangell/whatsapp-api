services:
  whatsapp-baileys:
    image: whatsapp-baileys:latest
    build: .
    container_name: whatsapp-baileys
    ports:
      - "3000:3000"
    volumes:
      # Sessão do WhatsApp. Apagar = precisar parear de novo.
      - kv:/data
      # Arquivos que /enviar-arquivo pode mandar (somente leitura).
      - ./arquivos:/arquivos:ro
    environment:
      - PORT=3000
      - SESSAO=suporte
      # Descomente para exportar logs/traces via OpenTelemetry.
      # O Deno instrumenta o Deno.serve e captura os logs sozinho.
      # - OTEL_DENO=true
      # - OTEL_SERVICE_NAME=whatsapp-baileys
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    restart: unless-stopped
    # O QR aparece aqui: docker compose up (sem -d) ou docker compose logs -f
    tty: true
    networks:
      - grupotodanet

volumes:
  kv:

networks:
  grupotodanet:
    external: true
