services:
  whatsapp:
    image: whatsapp-api:${WA_ENGINE:-baileys}
    build:
      context: .
      dockerfile: Dockerfile.${WA_ENGINE:-baileys}
    container_name: whatsapp-api
    ports:
      - "3000:3000"
    volumes:
      # Persistência unificada:
      # - /data/kv.sqlite3 (Leads, Cooldown, Métricas e Auth Baileys)
      # - /data/tokens (Perfil e tokens Chrome do WPPConnect)
      - ./data:/data
      # Arquivos que /enviar-arquivo pode mandar (somente leitura)
      - ./arquivos:/arquivos:ro
    environment:
      - PORT=3000
      - WA_ENGINE=${WA_ENGINE:-baileys}
      - SESSAO=suporte
      - USE_CHROME=true
      - HEADLESS=true
      - WPP_TOKENS_DIR=/data/tokens
      - KV_PATH=/data/kv.sqlite3
      - PASTA_ARQUIVOS=/arquivos
      # Descomente para exportar logs/traces via OpenTelemetry:
      # - OTEL_DENO=true
      # - OTEL_SERVICE_NAME=whatsapp-api
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    restart: unless-stopped
    # O QR Code aparece aqui: docker compose up (sem -d) ou docker compose logs -f
    tty: true
    networks:
      - grupotodanet

networks:
  grupotodanet:
    external: true
